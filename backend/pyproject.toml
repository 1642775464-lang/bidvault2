[project]
name = "bidvault2-backend"
version = "0.2.0"
description = "标库 BidVault v2 后端（单机版）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "watchdog>=4.0",
    "openpyxl>=3.1",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.3",
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
]

[project.optional-dependencies]
ai = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PERF", "RUF"]
ignore = [
    "PLC0415",
    "RUF001", "RUF002", "RUF003",
    "PLR2004",
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
