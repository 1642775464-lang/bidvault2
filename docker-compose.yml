# ONLYOFFICE Document Server（阶段二：原始 DOCX 查看/编辑）
# 用法：docker compose up -d
# 浏览器加载编辑器：http://localhost:8080（ONLYOFFICE_DOCUMENT_SERVER_PUBLIC_URL）
# DS 回调/拉取文件：http://host.docker.internal:8000（ONLYOFFICE_BACKEND_INTERNAL_URL）
services:
  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: bidvault-ds
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-bidvault-onlyoffice-dev-secret}
      - JWT_HEADER=Authorization
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ds_logs:/var/log/onlyoffice
      - ds_data:/var/www/onlyoffice/Data
      # 中文字体：民机文档使用宋体/黑体/仿宋/Times New Roman/仿宋_GB2312 等，
      # DS 镜像无中文字体，挂载宿主机字体避免 fallback 导致分页/表格漂移
      - C:/Windows/Fonts:/usr/share/fonts/windows:ro

volumes:
  ds_logs:
  ds_data:
